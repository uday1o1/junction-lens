syntax = "proto3";

package junctionlens.v1;

enum SourceDomain {
  SOURCE_DOMAIN_UNSPECIFIED = 0;
  SOURCE_DOMAIN_OPENLANE_V2 = 1;
  SOURCE_DOMAIN_SYNTHETIC = 2;
  SOURCE_DOMAIN_LIVE = 3;
}

enum ArtifactKind {
  ARTIFACT_KIND_UNSPECIFIED = 0;
  ARTIFACT_KIND_SOURCE_IMAGE = 1;
  ARTIFACT_KIND_RAW_TENSOR = 2;
  ARTIFACT_KIND_MODEL = 3;
  ARTIFACT_KIND_MANIFEST = 4;
  ARTIFACT_KIND_EVALUATOR_INPUT = 5;
}

enum CameraSlot {
  CAMERA_SLOT_UNSPECIFIED = 0;
  CAMERA_SLOT_FRONT_CENTER = 1;
  CAMERA_SLOT_FRONT_LEFT = 2;
  CAMERA_SLOT_FRONT_RIGHT = 3;
  CAMERA_SLOT_SIDE_LEFT = 4;
  CAMERA_SLOT_SIDE_RIGHT = 5;
  CAMERA_SLOT_REAR_LEFT = 6;
  CAMERA_SLOT_REAR_CENTER = 7;
  CAMERA_SLOT_REAR_RIGHT = 8;
}

enum DistortionModel {
  DISTORTION_MODEL_UNSPECIFIED = 0;
  DISTORTION_MODEL_NONE = 1;
  DISTORTION_MODEL_BROWN_CONRADY = 2;
  DISTORTION_MODEL_FISHEYE = 3;
}

enum SourceBoxConvention {
  SOURCE_BOX_CONVENTION_UNSPECIFIED = 0;
  SOURCE_BOX_CONVENTION_XYXY_INCLUSIVE = 1;
  SOURCE_BOX_CONVENTION_XYXY_HALF_OPEN = 2;
  SOURCE_BOX_CONVENTION_TWO_CORNERS = 3;
}

enum GraphRole {
  GRAPH_ROLE_UNSPECIFIED = 0;
  GRAPH_ROLE_GROUND_TRUTH = 1;
  GRAPH_ROLE_PREDICTION = 2;
}

enum NodeType {
  NODE_TYPE_UNSPECIFIED = 0;
  NODE_TYPE_LANE_SEGMENT = 1;
  NODE_TYPE_TRAFFIC_CONTROL = 2;
  NODE_TYPE_ROAD_AREA = 3;
}

enum GraphEdgeType {
  GRAPH_EDGE_TYPE_UNSPECIFIED = 0;
  GRAPH_EDGE_TYPE_LANE_SUCCESSOR = 1;
  GRAPH_EDGE_TYPE_CONTROL_APPLIES_TO_LANE = 2;
}

enum TrackTerminationReason {
  TRACK_TERMINATION_REASON_UNSPECIFIED = 0;
  TRACK_TERMINATION_REASON_ACTIVE = 1;
  TRACK_TERMINATION_REASON_MAX_MISSES = 2;
  TRACK_TERMINATION_REASON_SEGMENT_END = 3;
  TRACK_TERMINATION_REASON_REPLACED = 4;
}

message FrameKey {
  string dataset_id = 1;
  string dataset_version = 2;
  string split_id = 3;
  string segment_id = 4;
  int64 timestamp_ns = 5;
  SourceDomain source_domain = 6;
  string calibration_sha256 = 7;
  string frame_manifest_sha256 = 8;
}

message ArtifactRef {
  ArtifactKind kind = 1;
  string sha256 = 2;
  uint64 byte_size = 3;
  string media_type = 4;
  string relative_uri = 5;
  string license_id = 6;
}

message ProducerInfo {
  string git_commit = 1;
  bool git_dirty = 2;
  string model_artifact_sha256 = 3;
  string configuration_sha256 = 4;
  string runtime_build_sha256 = 5;
  string execution_provider_profile = 6;
  string provider_assignment_digest = 7;
  optional uint64 random_seed = 8;
}

message Matrix3d {
  repeated double values = 1;
}

message Matrix4d {
  repeated double values = 1;
}

message ImageTransform {
  Matrix3d original_to_model = 1;
  uint32 resized_width = 2;
  uint32 resized_height = 3;
  uint32 crop_left = 4;
  uint32 crop_top = 5;
  uint32 pad_left = 6;
  uint32 pad_top = 7;
}

message CameraFrame {
  CameraSlot slot = 1;
  bool valid = 2;
  optional ArtifactRef original_image = 3;
  int64 capture_timestamp_ns = 4;
  uint32 original_width = 5;
  uint32 original_height = 6;
  Matrix3d intrinsic = 7;
  Matrix4d t_vehicle_camera = 8;
  DistortionModel distortion_model = 9;
  repeated double distortion_coefficients = 10;
  ImageTransform image_transform = 11;
}

message SensorFrame {
  FrameKey frame_key = 1;
  repeated CameraFrame cameras = 2;
  Matrix4d t_world_vehicle = 3;
  bool pose_valid = 4;
  string adapter_version = 5;
}

message Point3d {
  double x = 1;
  double y = 2;
  double z = 3;
}

message LaplaceScale3d {
  double x = 1;
  double y = 2;
  double z = 3;
}

message Polyline3d {
  repeated Point3d points = 1;
  double confidence = 2;
  repeated LaplaceScale3d point_uncertainty = 3;
}

message ClassDistribution {
  repeated double probabilities = 1;
}

message AdapterMetadata {
  string source_object_id = 1;
  string source_namespace = 2;
}

message LaneSegment {
  uint64 node_id = 1;
  optional uint64 track_id = 2;
  Polyline3d centerline = 3;
  Polyline3d left_boundary = 4;
  Polyline3d right_boundary = 5;
  ClassDistribution left_boundary_type = 6;
  ClassDistribution right_boundary_type = 7;
  double intersection_or_connector_probability = 8;
  double existence_confidence = 9;
  repeated LaplaceScale3d centerline_laplace_scale_m = 10;
  uint32 decoder_query_index = 11;
  optional AdapterMetadata adapter_metadata = 12;
}

message SourcePixelBox {
  double x0 = 1;
  double y0 = 2;
  double x1 = 3;
  double y1 = 4;
  SourceBoxConvention convention = 5;
  uint32 image_width = 6;
  uint32 image_height = 7;
}

message NormalizedBox {
  double x_min = 1;
  double y_min = 2;
  double x_max = 3;
  double y_max = 4;
}

message TrafficControl {
  uint64 node_id = 1;
  optional uint64 track_id = 2;
  CameraSlot source_camera = 3;
  optional SourcePixelBox source_pixel_box = 4;
  NormalizedBox normalized_half_open_box = 5;
  ClassDistribution category_distribution = 6;
  ClassDistribution attribute_distribution = 7;
  double existence_confidence = 8;
  double calibrated_class_confidence = 9;
  double calibrated_attribute_confidence = 10;
  uint32 decoder_query_index = 11;
  optional AdapterMetadata adapter_metadata = 12;
}

message RoadArea {
  uint64 node_id = 1;
  optional uint64 track_id = 2;
  ClassDistribution category_distribution = 3;
  Polyline3d geometry = 4;
  double existence_confidence = 5;
  repeated LaplaceScale3d geometry_uncertainty = 6;
  uint32 decoder_query_index = 7;
  optional AdapterMetadata adapter_metadata = 8;
}

message EdgeUncertainty {
  double standard_deviation = 1;
  string method = 2;
}

message GraphEdge {
  uint64 edge_id = 1;
  GraphEdgeType edge_type = 2;
  uint64 source_node_id = 3;
  uint64 target_node_id = 4;
  double raw_probability = 5;
  double calibrated_probability = 6;
  bool binary_decision = 7;
  optional EdgeUncertainty uncertainty = 8;
}

message MatchingCostComponents {
  double geometry = 1;
  double class_cost = 2;
  double motion = 3;
  double total = 4;
}

message TemporalTrack {
  uint64 track_id = 1;
  NodeType node_type = 2;
  uint64 current_node_id = 3;
  int64 first_timestamp_ns = 4;
  int64 last_timestamp_ns = 5;
  uint32 age_observed_frames = 6;
  uint32 missed_frame_count = 7;
  TrackTerminationReason termination_reason = 8;
  MatchingCostComponents matching_cost = 9;
}

message ValidationWarning {
  string reason_code = 1;
  string path = 2;
  string message = 3;
}

message SceneControlGraph {
  FrameKey frame_key = 1;
  GraphRole role = 2;
  optional SensorFrame sensor_frame = 3;
  repeated LaneSegment lanes = 4;
  repeated TrafficControl traffic_controls = 5;
  repeated RoadArea road_areas = 6;
  repeated GraphEdge edges = 7;
  repeated TemporalTrack tracks = 8;
  repeated ArtifactRef raw_tensor_artifacts = 9;
  repeated ValidationWarning warnings = 10;
}

message SceneControlGraphEnvelope {
  uint32 schema_major = 1;
  uint32 schema_minor = 2;
  ProducerInfo producer = 3;
  SceneControlGraph graph = 4;
}
