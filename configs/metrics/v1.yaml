schema_version: junctionlens.metrics.v1
policy:
  custom_match: CustomMatchV1
  edge_threshold: 0.5
  confident_wrong_threshold: 0.9
  successor_endpoint_gap_threshold_m: 2.0
  empty_denominator: null
  quantile_method: linear_type_7
  temporal_geometry_resample_points: 20
metrics:
  DET_l:
    direction: higher_is_better
    unit: average_precision
    population: official OpenLane-V2 lane detection population
    denominator: official evaluator definition
    missing: invalid_when_unavailable
  DET_t:
    direction: higher_is_better
    unit: average_precision
    population: official OpenLane-V2 traffic-element detection population
    denominator: official evaluator definition
    missing: invalid_when_unavailable
  DET_a:
    direction: higher_is_better
    unit: average_precision
    population: official OpenLane-V2 area detection population
    denominator: official evaluator definition
    missing: invalid_when_unavailable
  TOP_ll:
    direction: higher_is_better
    unit: average_precision
    population: official OpenLane-V2 lane-lane topology population
    denominator: official evaluator definition
    missing: invalid_when_unavailable
  TOP_lt:
    direction: higher_is_better
    unit: average_precision
    population: official OpenLane-V2 lane-traffic topology population
    denominator: official evaluator definition
    missing: invalid_when_unavailable
  control_edge_precision:
    direction: higher_is_better
    unit: ratio
    population: thresholded predicted control-to-lane edges between matched eligible nodes
    denominator: predicted eligible edges
    missing: null_when_empty
  control_edge_recall:
    direction: higher_is_better
    unit: ratio
    population: ground-truth control-to-lane edges with matched endpoints
    denominator: eligible ground-truth edges
    missing: null_when_empty
  wrong_control_assignment_rate:
    direction: lower_is_better
    unit: ratio
    population: eligible matched controls with at least one thresholded predicted edge
    denominator: eligible controls with a predicted edge
    missing: null_when_empty
  confident_wrong_control_rate:
    direction: lower_is_better
    unit: ratio
    population: eligible matched controls with at least one thresholded predicted edge
    denominator: eligible controls with a predicted edge
    missing: null_when_empty
  reachability_recall_h3:
    direction: higher_is_better
    unit: ratio
    population: matched ground-truth lane pairs reachable within one to three hops
    denominator: eligible reachable lane pairs
    missing: null_when_empty
  path_blocking_rate_h3:
    direction: lower_is_better
    unit: ratio
    population: matched ground-truth lanes with an eligible continuation within three hops
    denominator: eligible source lanes
    missing: null_when_empty
  successor_endpoint_gap_m_median:
    direction: lower_is_better
    unit: meter
    population: thresholded predicted lane-successor edges
    denominator: eligible predicted edges
    missing: null_when_empty
  successor_endpoint_gap_m_p90:
    direction: lower_is_better
    unit: meter
    population: thresholded predicted lane-successor edges
    denominator: eligible predicted edges
    missing: null_when_empty
  successor_endpoint_gap_m_p95:
    direction: lower_is_better
    unit: meter
    population: thresholded predicted lane-successor edges
    denominator: eligible predicted edges
    missing: null_when_empty
  successor_endpoint_gap_over_threshold_rate:
    direction: lower_is_better
    unit: ratio
    population: thresholded predicted lane-successor edges
    denominator: eligible predicted edges
    missing: null_when_empty
  spurious_successor_rate:
    direction: lower_is_better
    unit: ratio
    population: thresholded predicted successor edges between matched lanes
    denominator: eligible predicted edges
    missing: null_when_empty
  presence_flicker_rate:
    direction: lower_is_better
    unit: ratio
    population: source-identified ground-truth nodes present for at least three consecutive frames
    denominator: eligible adjacent-frame transitions
    missing: null_when_empty
  successor_edge_flip_rate:
    direction: lower_is_better
    unit: ratio
    population: persistent ground-truth successor edges
    denominator: eligible adjacent-frame edge transitions
    missing: null_when_empty
  control_edge_flip_rate:
    direction: lower_is_better
    unit: ratio
    population: persistent ground-truth control-to-lane edges
    denominator: eligible adjacent-frame edge transitions
    missing: null_when_empty
  geometry_jitter_m_median:
    direction: lower_is_better
    unit: meter
    population: persistent matched lane and road-area nodes with valid ego poses
    denominator: eligible node transitions
    missing: null_when_empty
  geometry_jitter_m_p90:
    direction: lower_is_better
    unit: meter
    population: persistent matched lane and road-area nodes with valid ego poses
    denominator: eligible node transitions
    missing: null_when_empty
  geometry_jitter_m_p95:
    direction: lower_is_better
    unit: meter
    population: persistent matched lane and road-area nodes with valid ego poses
    denominator: eligible node transitions
    missing: null_when_empty
  id_switches_per_100_tracks:
    direction: lower_is_better
    unit: switches_per_100_tracks
    population: eligible source-identified ground-truth tracks with matched tracked predictions
    denominator: unique eligible ground-truth tracks
    missing: null_when_empty
  brier_score:
    direction: lower_is_better
    unit: score
    population: frozen CustomMatchV1 node or conditional edge calibration population
    denominator: predicted items with defined outcomes
    missing: null_when_empty
  negative_log_likelihood:
    direction: lower_is_better
    unit: nat
    population: frozen calibration population
    denominator: predicted items with defined outcomes
    missing: null_when_empty
  adaptive_ece_15:
    direction: lower_is_better
    unit: ratio
    population: frozen calibration population in deterministic equal-count bins
    denominator: predicted items with defined outcomes
    missing: null_when_empty
  aurc:
    direction: lower_is_better
    unit: risk_coverage_area
    population: frozen calibration population ordered by confidence and stable ID
    denominator: predicted items with defined outcomes
    missing: null_when_empty
  geometry_coverage_90:
    direction: target_is_better
    unit: ratio
    population: scalar point-coordinate residuals with calibrated Laplace scales
    denominator: eligible scalar coordinates
    missing: null_when_empty
  geometry_interval_width_m_median:
    direction: lower_is_better
    unit: meter
    population: marginal 90 percent Laplace intervals
    denominator: eligible scalar coordinates
    missing: null_when_empty
  geometry_interval_width_m_p90:
    direction: lower_is_better
    unit: meter
    population: marginal 90 percent Laplace intervals
    denominator: eligible scalar coordinates
    missing: null_when_empty
  runtime_latency_ms:
    direction: lower_is_better
    unit: millisecond
    population: measured non-warmup samples for one declared runtime phase
    denominator: measured samples
    missing: null_when_empty
  runtime_throughput_per_second:
    direction: higher_is_better
    unit: items_per_second
    population: measured non-warmup samples for one declared runtime phase
    denominator: measured samples
    missing: null_when_empty
