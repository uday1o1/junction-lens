[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "junctionlens"
version = "0.1.0"
description = "Local-first control-aware road-scene graph development and release evidence"
readme = "README.md"
requires-python = ">=3.12.0,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "JunctionLens contributors" }]
dependencies = [
  "jsonschema==4.24.0",
  "Pillow==12.3.0",
  "platformdirs==4.3.8",
  "protobuf==6.31.1",
  "pydantic==2.11.7",
  "PyYAML==6.0.2",
  "typer==0.16.0",
]

[project.optional-dependencies]
analytics = [
  "duckdb==1.3.2",
  "polars==1.31.0",
  "pyarrow==20.0.0",
]
cpu = [
  "numpy==2.2.6",
  "onnx==1.18.0",
  "onnx-ir==1.0.0",
  "onnxscript==0.7.1",
  "onnxruntime==1.25.0",
  "scipy==1.15.3",
  "torch==2.8.0",
  "torchvision==0.23.0",
]
cuda = [
  "numpy==2.2.6; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "onnx==1.18.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "onnx-ir==1.0.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "onnxscript==0.7.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "onnxruntime==1.25.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "scipy==1.15.3; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "torch==2.8.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "torchvision==0.23.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
service = [
  "fastapi==0.116.1",
  "uvicorn==0.35.0",
]

[project.scripts]
junctionlens = "junctionlens.cli.main:app"

[dependency-groups]
dev = [
  "coverage==7.10.1",
  "hypothesis==6.136.6",
  "mypy==1.17.0",
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "ruff==0.12.7",
  "types-jsonschema==4.24.0.20250528",
  "types-PyYAML==6.0.12.20250516",
]

[tool.hatch.build.targets.wheel]
packages = ["python/junctionlens"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]
required-version = "==0.11.23"
environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cu128", extra = "cuda" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cu128", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["python", "tests"]
extend-exclude = [
  "python/junctionlens/v1/scene_control_graph_pb2.py",
  "python/junctionlens/v1/scene_control_graph_pb2.pyi",
]

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "PIE", "PT", "PTH", "RUF", "S", "SIM", "UP", "W"]
ignore = [
  "COM812",
  "S603",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["junctionlens"]
mypy_path = "python"
exclude = ["python/junctionlens/v1/scene_control_graph_pb2.py"]

[[tool.mypy.overrides]]
module = ["torch", "torch.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["onnxruntime", "onnxruntime.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["google.protobuf", "google.protobuf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["junctionlens"]

[tool.coverage.report]
show_missing = true
skip_covered = false
