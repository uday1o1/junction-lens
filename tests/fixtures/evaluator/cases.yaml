schema_version: junctionlens.official-evaluator-cases.v1
base: perfect.json
cases:
  perfect:
    transform: {kind: identity}
    expected_changed: []
    expected_metrics: {DET_a: 1.0, DET_l: 1.0, DET_t: 1.0, OLUS: 1.0, TOP_ll: 1.0, TOP_lt: 1.0}
  empty_scene:
    transform: {kind: empty_scene}
    expected_changed: [TOP_ll, TOP_lt]
    expected_metrics: {DET_a: 1.0, DET_l: 1.0, DET_t: 1.0, OLUS: 0.6000000238418579, TOP_ll: 0.0, TOP_lt: 0.0}
  empty_predictions:
    transform: {kind: empty_predictions}
    expected_changed: [DET_a, DET_l, DET_t, TOP_ll, TOP_lt]
    expected_metrics: {DET_a: 0.0, DET_l: 0.0, DET_t: 0.0, OLUS: 0.0, TOP_ll: 0.0, TOP_lt: 0.0}
  partial_predictions:
    transform: {kind: partial_predictions}
    expected_changed: [DET_a, DET_l, DET_t, TOP_ll, TOP_lt]
    expected_metrics: {DET_a: 0.5, DET_l: 0.5454545617103577, DET_t: 0.5384615659713745, OLUS: 0.46284257420439073, TOP_ll: 0.0, TOP_lt: 0.5333333333333333}
  duplicate_confidence:
    transform: {kind: duplicate_confidence}
    expected_changed: []
    expected_metrics: {DET_a: 1.0, DET_l: 1.0, DET_t: 1.0, OLUS: 1.0, TOP_ll: 1.0, TOP_lt: 1.0}
  permuted_order:
    transform: {kind: permute_predictions}
    expected_changed: []
    expected_metrics: {DET_a: 1.0, DET_l: 1.0, DET_t: 1.0, OLUS: 1.0, TOP_ll: 1.0, TOP_lt: 1.0}
  adversarial_unpermuted_topology:
    transform: {kind: permute_predictions_without_topology}
    expected_changed: [TOP_ll, TOP_lt]
    expected_metrics: {DET_a: 1.0, DET_l: 1.0, DET_t: 1.0, OLUS: 0.7903797372294731, TOP_ll: 0.0, TOP_lt: 0.9061111086890811}
  adversarial_high_confidence_false_positive:
    transform: {kind: adversarial_high_confidence_false_positive}
    expected_changed: [DET_l]
    expected_metrics: {DET_a: 1.0, DET_l: 0.666666567325592, DET_t: 1.0, OLUS: 0.9333333134651184, TOP_ll: 1.0, TOP_lt: 1.0}
  corrupt_lane_geometry:
    transform:
      kind: replacements
      replacements:
        - path: /predictions/results/segment-001~1frame-0001/predictions/lane_segment/0/centerline
          value: [[20.0, 0.0, 0.0], [20.0, 5.0, 0.0], [20.0, 10.0, 0.0]]
    expected_changed: [DET_l]
    expected_metrics: {DET_a: 1.0, DET_l: 0.27272728085517883, DET_t: 1.0, OLUS: 0.5911714663838304, TOP_ll: 0.0, TOP_lt: 0.4666666666666667}
  corrupt_area_geometry:
    transform:
      kind: replacements
      replacements:
        - path: /predictions/results/segment-001~1frame-0001/predictions/area/0/points
          value: [[20.0, 20.0, 0.0], [22.0, 20.0, 0.0], [22.0, 22.0, 0.0], [20.0, 22.0, 0.0]]
    expected_changed: [DET_a]
    expected_metrics: {DET_a: 0.5, DET_l: 1.0, DET_t: 1.0, OLUS: 0.9, TOP_ll: 1.0, TOP_lt: 1.0}
  corrupt_traffic_box:
    transform:
      kind: replacements
      replacements:
        - path: /predictions/results/segment-001~1frame-0001/predictions/traffic_element/0/points
          value: [[200.0, 200.0], [205.0, 205.0]]
    expected_changed: [DET_t]
    expected_metrics: {DET_a: 1.0, DET_l: 1.0, DET_t: 0.9230769276618958, OLUS: 0.9768454064770301, TOP_ll: 1.0, TOP_lt: 0.9238095238095237}
  corrupt_lane_topology:
    transform:
      kind: replacements
      replacements:
        - path: /predictions/results/segment-001~1frame-0001/predictions/topology_lsls/0/1
          value: 0.01
    expected_changed: [TOP_ll]
    expected_metrics: {DET_a: 1.0, DET_l: 1.0, DET_t: 1.0, OLUS: 0.9414213538169861, TOP_ll: 0.5, TOP_lt: 1.0}
  corrupt_control_topology:
    transform:
      kind: replacements
      replacements:
        - path: /predictions/results/segment-001~1frame-0001/predictions/topology_lste/0/0
          value: 0.01
    expected_changed: [TOP_lt]
    expected_metrics: {DET_a: 1.0, DET_l: 1.0, DET_t: 1.0, OLUS: 0.992230020944651, TOP_ll: 1.0, TOP_lt: 0.9238095238095237}
