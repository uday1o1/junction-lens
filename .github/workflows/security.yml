name: Security

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  supply-chain:
    name: Supply chain and parser boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install locked uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: 0.11.23
          enable-cache: false
      - name: Install locked Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.18.0
      - name: Synchronize exact dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.17.1 --activate
          uv sync --locked --extra cpu --extra analytics --extra service
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Test bounded parsers and seeded controls
        run: |
          uv run --locked pytest \
            tests/security/test_parser_limits.py \
            tests/security/test_archive_extraction.py \
            tests/security/test_supply_chain.py \
            tests/unit/test_api_repository.py \
            tests/integration/test_app_cli_api.py
      - name: Scan secrets and inventory licenses
        run: uv run --locked python scripts/security/supply_chain.py all-local
      - name: Query dependency advisories
        run: ./tools/jl scan-dependencies
      - name: Generate deterministic SBOM
        run: ./tools/jl generate-sbom
